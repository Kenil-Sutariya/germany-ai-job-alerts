name: Germany AI Jobs → Telegram

on:
  schedule:
    # Check every 5 minutes. GitHub schedules may be delayed.
    - cron: '2/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: germany-ai-job-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check source and send Telegram alerts
        env:
          GITHUB_SOURCE_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_ALERTS: '12'
        run: python monitor.py

      - name: Commit updated state and review queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/seen.json state/review_queue.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update AI job monitor state and review queue'
            git push
          else
            echo 'No state or review queue changes to commit.'
          fi
